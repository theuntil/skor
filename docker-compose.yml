services:
  superlig-api:
    build: .
    image: superlig-api:latest
    container_name: superlig-api
    ports:
      - "8080:80"
    environment:
      # Her 3 saatte bir güncelle. Örn. günde 1 kez için: "0 2 * * *"
      CRON_SCHEDULE: "0 */3 * * *"
      # refresh.php endpoint'ini korumak için token (boş bırakılırsa korumasız çalışır)
      REFRESH_TOKEN: "changeme-cok-gizli-bir-token"
      # Mobil app'in api.php'ye erişmek için göndermesi gereken key
      # (boş bırakılırsa API korumasız/herkese açık çalışır)
      API_KEY: "changeme-mobil-app-key"
    volumes:
      # Scrape edilen veri (JSON/PHP) ve cron.log burada kalıcı olur.
      - tff_data:/var/www/html/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api.php?health=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tff_data:
